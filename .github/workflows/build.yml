name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          # Single-config generators put the exe in build/, VS puts it in build/Release/
          $exe = Get-ChildItem -Recurse build -Filter KnobApp.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/Knob.exe
          windeployqt --release --no-translations dist/Knob.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Knob-windows
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Homebrew Qt, not aqt: the aqt macOS binaries drag in a reference to
      # Apple's removed AGL framework at link time (seen on 6.7 AND 6.8);
      # brew's build doesn't, and it matches the development environment.
      - name: Install Qt
        run: brew install qt ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Bundle + DMG (unsigned — sign/notarize locally for release)
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/KnobApp.app -always-overwrite
          STAGE=$(mktemp -d)
          cp -R build/KnobApp.app "$STAGE/Knob.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Knob" -srcfolder "$STAGE" -ov -format UDZO Knob.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Knob-macos
          path: Knob.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Knob-windows
          path: knob-windows

      - uses: actions/download-artifact@v4
        with:
          name: Knob-macos
          path: knob-macos

      - name: Zip Windows build
        run: cd knob-windows && zip -r ../Knob-windows.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Knob-windows.zip
            knob-macos/Knob.dmg
          body: |
            **Knob companion app** for [BaselineDesign KNOB](https://baselinedesign.tech/products/knobv21) devices.

            - **Knob-windows.zip** — unzip anywhere, run `Knob.exe` (tray app). Configurator only: keys + slide-pot mapping over USB. For smooth scrolling on Windows, flash the `knoble_hires` firmware ([KnoBLE](https://github.com/Architeuthis-Flux/KnoBLE)).
            - **Knob.dmg** — macOS: smooth acceleration-free scrolling + full configurator. ⚠️ CI build, unsigned: right-click → Open on first launch, and grant Accessibility + Input Monitoring when prompted.
